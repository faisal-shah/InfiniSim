name: Build InfiniSim LVGL Simulator

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      infinitime_ref:
        description: InfiniTime branch, tag, or full SHA to compile
        required: true
        default: family-features
        type: string

permissions:
  contents: read

env:
  INFINITIME_REF: ${{ inputs.infinitime_ref || 'family-features' }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Install build dependencies
        run:  |
          sudo apt-get update -qq
          sudo apt-get -y install --no-install-recommends \
            cmake \
            libsdl2-dev \
            libpng-dev \
            ninja-build \
            python3-pil

      - name: Install lv_font_conv
        run: npm i -g lv_font_conv@1.5.2

      - name: Checkout source files
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: family/InfiniSim

      - name: Checkout InfiniSim runtime submodules
        working-directory: family/InfiniSim
        run: git submodule update --init lv_drivers

      - name: Checkout family InfiniTime
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/InfiniTime
          ref: ${{ env.INFINITIME_REF }}
          path: family/InfiniTime
          submodules: recursive

      - name: Record selected revisions
        run: |
          {
            echo "## Selected revisions"
            echo
            echo "| Repository | Requested ref | Resolved SHA |"
            echo "|---|---|---|"
            echo "| InfiniSim | event SHA | $(git -C family/InfiniSim rev-parse HEAD) |"
            echo "| InfiniTime | \`$INFINITIME_REF\` | $(git -C family/InfiniTime rev-parse HEAD) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify generated simulator contract
        run: |
          python3 family/InfiniTime/tools/generate_companion_protocol.py \
            --workspace-root family \
            --targets infinisim \
            --check

      - name: CMake
        run:  |
          cmake -G Ninja \
            -S family/InfiniSim \
            -B family/InfiniSim/build_lv_sim \
            -DInfiniTime_DIR="${GITHUB_WORKSPACE}/family/InfiniTime"

      - name: Build simulator executable
        run: cmake --build family/InfiniSim/build_lv_sim

      - name: Run native tests
        run:  |
          ctest --test-dir family/InfiniSim/build_lv_sim \
            --output-on-failure \
            --output-junit ctest-junit.xml

      - name: Upload simulator executable
        uses: actions/upload-artifact@v4
        with:
          name: infinisim
          path: family/InfiniSim/build_lv_sim/infinisim

      - name: Upload littlefs-do executable
        uses: actions/upload-artifact@v4
        with:
          name: littlefs-do
          path: family/InfiniSim/build_lv_sim/littlefs-do
